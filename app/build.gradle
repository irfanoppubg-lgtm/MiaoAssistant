plugins {
    id 'com.android.application'
}

android {
    namespace 'com.miao.assistant'
    compileSdk 34

    defaultConfig {
        applicationId 'com.miao.assistant'
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:102'
}
